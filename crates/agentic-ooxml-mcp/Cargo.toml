[package]
name = "agentic-ooxml-mcp"
description = "MCP server (stdio, JSON-RPC 2.0) exposing the agentic-ooxml library with a roots allowlist and write gating."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentic-ooxml-mcp"
path = "src/main.rs"

[dependencies]
agentic-ooxml = { path = "../agentic-ooxml" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
zip = "2.2"
