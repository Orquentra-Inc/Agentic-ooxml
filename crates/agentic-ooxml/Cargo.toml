[package]
name = "agentic-ooxml"
description = "Read, write and verify Agentic OOXML knowledge parts (custom XML) inside .docx, .pptx and .xlsx packages."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
quick-xml = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
zip = "9.1"
