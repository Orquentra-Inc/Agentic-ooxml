name: Website build

# Builds the site on every change to it, without deploying. Deployment is in pages.yml.
on:
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
