name: Feature request
description: Suggest a capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: What did you try or consider instead?
  - type: dropdown
    id: roadmap
    attributes:
      label: Is it already on the roadmap?
      options:
        - I checked ROADMAP.md and it is not listed
        - It is listed as proposed
        - I did not check
